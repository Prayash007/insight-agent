services:
  # InsightAgent FastAPI Backend + FastMCP
  - type: web
    name: insight-agent-backend
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: insight-brokerage-db
          property: connectionString
      - key: MCP_USE_IN_PROCESS
        value: "true"
      - key: DEFAULT_MODEL
        value: "gemini-3-flash-preview"
      - key: GEMINI_API_KEY
        sync: false

databases:
  # Managed PostgreSQL 16
  - name: insight-brokerage-db
    plan: free
    region: oregon
    databaseName: insight_brokerage
    user: angel_analyst
